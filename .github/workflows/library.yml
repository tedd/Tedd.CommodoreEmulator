# Builds, tests and packs the libraries that are published as NuGet packages:
#   Tedd.MOS65xx.Emulator    the emulator core
#   Tedd.MOS65xx.Hosting     session, key bindings, video/audio sink contracts
#   Tedd.MOS65xx.Embedding   raw frames and PCM for Vulkan, Avalonia and other hosts that draw the picture themselves
#
# Runs on pushes to master, on pull requests, by hand, and from the Deploy workflow (which then attaches the packages
# to its release). The .nupkg/.snupkg files are uploaded as the "nuget-packages" artifact of the run.
#
# Version: major.minor from src/Package.props, patch = number of commits in the history of the built commit, so every
# commit gets its own increasing version and rebuilding a commit gives the same one.

name: Library

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
  workflow_call:
    inputs:
      skip-tests:
        description: Skip the test suite (the caller has run it already)
        type: boolean
        default: false
    outputs:
      version:
        description: Version of the packages
        value: ${{ jobs.pack.outputs.version }}

permissions:
  contents: read

env:
  DOTNET_VERSION: 11.0.x
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  pack:
    name: Build, test and pack
    runs-on: windows-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the whole history: the patch number is the commit count
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}
          dotnet-quality: preview
      - name: Version
        id: version
        shell: pwsh
        run: |
          $prefix = ([xml](Get-Content src/Package.props)).Project.PropertyGroup.VersionPrefix
          $parts = $prefix.Split('.')
          $version = "$($parts[0]).$($parts[1]).$(git rev-list --count HEAD)"
          "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Package version $version"
      # Builds both target frameworks (net11.0, netstandard2.1) of the three libraries.
      - name: Build
        run: dotnet build src/Tedd.MOS65xx.Embedding/Tedd.MOS65xx.Embedding.csproj -c Release -p:Version=${{ steps.version.outputs.version }}
      - name: Test (fast suite; ROM-dependent tests skip themselves)
        if: ${{ !inputs.skip-tests }}
        run: dotnet test src/Tedd.MOS65xx.Tests/Tedd.MOS65xx.Tests.csproj -c Release -p:Version=${{ steps.version.outputs.version }} --filter "Category!=Slow&Category!=Harte&Category!=Lorenz" --logger "trx;LogFileName=library-tests.trx"
      - uses: actions/upload-artifact@v4
        if: ${{ always() && !inputs.skip-tests }}
        with:
          name: library-test-results
          path: src/Tedd.MOS65xx.Tests/TestResults/*.trx
          if-no-files-found: ignore
      - name: Pack
        shell: pwsh
        run: |
          foreach ($project in 'Emulator', 'Hosting', 'Embedding') {
            dotnet pack "src/Tedd.MOS65xx.$project/Tedd.MOS65xx.$project.csproj" -c Release --no-build -p:Version=${{ steps.version.outputs.version }} -o artifacts/packages
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          Get-ChildItem artifacts/packages
      - uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/packages/*.nupkg
            artifacts/packages/*.snupkg
          if-no-files-found: error
